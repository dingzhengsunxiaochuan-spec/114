<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>图片文字 · 对话框编辑器</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    background:#0b0d10; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family: system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; padding:12px; overflow:hidden;
  }
  .phone-frame {
    width:390px; max-width:100%; height:780px; max-height:94vh; background:#111315;
    border-radius:44px;
    box-shadow: 0 30px 50px rgba(0,0,0,0.8), 0 0 0 8px #1e2023, 0 0 0 12px #2a2d31;
    overflow:hidden; display:flex; flex-direction:column; position:relative;
  }
  .status-bar {
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 24px 8px 24px; color:#f0f0f0; font-size:15px; font-weight:500; flex-shrink:0;
  }
  .app-bar {
    display:flex; align-items:center; justify-content:space-between;
    padding:4px 20px 12px 20px; flex-shrink:0;
  }
  .app-bar h1 { font-size:20px; font-weight:700; color:#f0f3f7; letter-spacing:-0.3px; }
  .app-bar .actions { display:flex; gap:8px; }

  /* ★ 通用按钮样式 */
  .btn {
    border:none; outline:none; cursor:pointer; font-family:inherit; font-weight:600;
    border-radius:40px; transition:transform .15s ease;
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    user-select:none; text-decoration:none;
  }
  .btn:active { transform:scale(0.94); }
  .btn-sm { padding:8px 14px; font-size:13px; background:#2c3138; color:#e0e6ed; }
  .btn-primary { background:#3b7cff; color:#fff; padding:10px 18px; font-size:14px;
    box-shadow:0 4px 12px rgba(59,124,255,.4); }

  /* ★★★ 关键：label 作为按钮，input 隐藏在 label 内 ★★★ */
  .import-label {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    background: #2c3138;
    color: #e0e6ed;
    border-radius: 40px;
    cursor: pointer;
    overflow: hidden;
    /* 关键：确保 label 本身可点击 */
    pointer-events: auto;
  }
  .import-label:active { transform:scale(0.94); }

  /* input 仍然透明覆盖，但这次在 label 内，点击 label 就会激活它 */
  .import-label input[type="file"] {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    opacity: 0;
    cursor: pointer;
    /* 关键：不要用 display:none / visibility:hidden，那样点击会失效 */
    /* 关键：不要让父级 pointer-events:none 影响 */
    pointer-events: auto;
    font-size: 100px; /* 防止某些安卓浏览器位置错乱 */
  }

  .editor-stage {
    flex:1; position:relative; overflow:hidden;
    margin:0 16px; border-radius:24px; border:1px solid #23272d;
    display:flex; align-items:center; justify-content:center;
    background-image:
      linear-gradient(45deg,#14171b 25%,transparent 25%),
      linear-gradient(-45deg,#14171b 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#14171b 75%),
      linear-gradient(-45deg,transparent 75%,#14171b 75%);
    background-size:20px 20px;
    background-position:0 0,0 10px,10px -10px,-10px 0px;
    background-color:#0f1114;
    min-height: 0;
  }

  .canvas-wrap {
    position:relative;
    display:inline-block;
    line-height:0;
    max-width:100%;
    max-height:100%;
  }

  #bgImage {
    display:block;
    max-width:100%;
    max-height:100%;
    width:auto;
    height:auto;
    object-fit:contain;
    pointer-events:none;
    border-radius:8px;
    box-shadow:0 8px 30px rgba(0,0,0,.6);
  }

  .placeholder {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#5a6371; gap:12px; padding:40px; text-align:center; pointer-events:none;
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  }
  .placeholder .icon { font-size:52px; opacity:.6; }
  .placeholder .text { font-size:14px; line-height:1.5; font-weight:500; }

  .overlay-layer {
    position:absolute; top:0; left:0; width:100%; height:100%;
    pointer-events:none; overflow:visible; border-radius:8px;
  }

  .draggable-item {
    position:absolute; pointer-events:auto; cursor:grab;
    user-select:none; touch-action:none; z-index:10;
  }
  .draggable-item.selected {
    z-index:20;
    box-shadow:0 0 0 2px #3b7cff, 0 0 0 4px rgba(59,124,255,.3);
    border-radius:6px;
  }

  .text-block {
    min-width:40px; padding:6px 10px; color:#fff; font-weight:700;
    font-size:22px; line-height:1.25;
    text-shadow:0 2px 8px rgba(0,0,0,.6);
    white-space:pre-wrap; word-break:break-word; outline:none;
    border-radius:6px; background:rgba(0,0,0,.15);
    border:1px dashed rgba(255,255,255,.25);
  }

  .bubble-block {
    max-width:200px; min-width:60px; padding:12px 16px; border-radius:20px;
    font-weight:600; font-size:16px; line-height:1.4; color:#1a1d21;
    word-break:break-word; position:relative; white-space:pre-wrap;
    box-shadow:0 6px 16px rgba(0,0,0,.35); border:2px solid transparent; outline:none;
  }
  .bubble-block::after {
    content:''; position:absolute; bottom:-14px; left:24px;
    width:0; height:0;
    border-left:10px solid transparent;
    border-right:10px solid transparent;
    border-top:16px solid currentColor;
  }

  .resize-handle {
    position:absolute; width:22px; height:22px; background:#3b7cff;
    border:3px solid #fff; border-radius:50%; bottom:-12px; right:-12px;
    cursor:nwse-resize; pointer-events:auto;
    box-shadow:0 2px 8px rgba(0,0,0,.5); touch-action:none; z-index:25;
    display:none;
  }
  .draggable-item.selected .resize-handle { display:block; }

  .delete-btn {
    position:absolute; width:24px; height:24px; background:#e5484d; color:#fff;
    border:2px solid #fff; border-radius:50%; top:-12px; right:-12px;
    cursor:pointer; pointer-events:auto; display:none;
    align-items:center; justify-content:center; font-size:14px; font-weight:700;
    line-height:1; box-shadow:0 2px 8px rgba(0,0,0,.5); z-index:25;
  }
  .draggable-item.selected .delete-btn { display:flex; }

  .toolbar {
    flex-shrink:0; padding:12px 20px 8px 20px;
    display:flex; flex-direction:column; gap:10px;
  }
  .tool-row { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .tool-btn {
    display:flex; flex-direction:column; align-items:center; gap:3px;
    background:#1e2227; border:1px solid #2e3238; border-radius:16px;
    padding:8px 12px; color:#cbd5e1; font-size:11px; font-weight:600;
    cursor:pointer; transition:all .15s ease; min-width:60px;
    font-family:inherit;
  }
  .tool-btn:active { transform:scale(0.94); }
  .tool-btn .ico { font-size:18px; line-height:1; }
  .tool-btn:disabled { opacity:.4; pointer-events:none; }

  .color-row { display:flex; gap:8px; justify-content:center; align-items:center; flex-wrap:wrap; }
  .color-dot {
    width:26px; height:26px; border-radius:50%; cursor:pointer;
    border:2px solid transparent; transition:all .15s ease; flex-shrink:0;
  }
  .color-dot.active { border-color:#fff; box-shadow:0 0 0 2px #3b7cff; }

  .size-row {
    display:flex; align-items:center; gap:10px; padding:0 6px;
    color:#8e98a6; font-size:12px;
  }
  .size-row input[type="range"] {
    flex:1; -webkit-appearance:none; appearance:none; height:4px;
    background:#2e3238; border-radius:2px; outline:none;
  }
  .size-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance:none; width:18px; height:18px; border-radius:50%;
    background:#3b7cff; cursor:pointer; box-shadow:0 2px 6px rgba(59,124,255,.5);
  }
  .size-row .val { min-width:32px; text-align:right; color:#e0e6ed; font-weight:600; }

  .home-indicator {
    margin:4px auto 10px; width:130px; height:5px; background:#3d424a;
    border-radius:40px; opacity:.7; flex-shrink:0;
  }

  .toast {
    position:absolute; bottom:100px; left:50%;
    transform:translateX(-50%) translateY(20px);
    background:rgba(0,0,0,.85); color:#fff; padding:10px 20px;
    border-radius:40px; font-size:13px; font-weight:500; opacity:0;
    pointer-events:none; transition:all .3s ease; z-index:100;
    white-space:nowrap;
    border:1px solid rgba(255,255,255,.1);
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  /* 加载中遮罩 */
  .loading-mask {
    position:absolute; top:0; left:0; width:100%; height:100%;
    background:rgba(0,0,0,.6); display:none;
    align-items:center; justify-content:center; z-index:200;
    color:#fff; font-size:14px; font-weight:500;
    flex-direction: column; gap: 12px;
  }
  .loading-mask.show { display:flex; }
  .loading-spinner {
    width: 32px; height: 32px;
    border: 3px solid rgba(255,255,255,.2);
    border-top-color: #3b7cff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width:420px) {
    .phone-frame { height:95vh; border-radius:36px;
      box-shadow:0 20px 40px rgba(0,0,0,.9),0 0 0 6px #1e2023,0 0 0 10px #2a2d31; }
    .editor-stage { margin:0 10px; }
    .toolbar { padding:10px 10px 6px 10px; }
    .tool-btn { min-width:52px; padding:6px 8px; font-size:10px; }
    .app-bar h1 { font-size:17px; }
  }
</style>
</head>
<body>
<div class="phone-frame" id="app">
  <div class="status-bar">
    <span>9:41</span>
    <span>📶 🔋</span>
  </div>

  <div class="app-bar">
    <h1>图片编辑器</h1>
    <div class="actions">
      <!-- ★★★ 关键：label 包裹 input，安卓 Chrome 最可靠的方式 ★★★ -->
      <label class="btn btn-sm import-label" id="importLabel">
        <input type="file" id="fileInput" accept="image/*">
        📁 导入
      </label>
      <button class="btn btn-primary" id="exportBtn" type="button">导出</button>
    </div>
  </div>

  <div class="editor-stage" id="editorStage">
    <div class="placeholder" id="placeholder">
      <div class="icon">🖼️</div>
      <div class="text">点击“导入”按钮<br>选择一张图片开始编辑</div>
    </div>
    <div class="canvas-wrap" id="canvasWrap" style="display:none;">
      <img id="bgImage" alt="背景图片">
      <div class="overlay-layer" id="overlayLayer"></div>
    </div>
    <!-- 加载遮罩 -->
    <div class="loading-mask" id="loadingMask">
      <div class="loading-spinner"></div>
      <div>正在处理图片…</div>
    </div>
  </div>

  <div class="toolbar">
    <div class="tool-row">
      <button class="tool-btn" id="addTextBtn" type="button" disabled>
        <span class="ico">T</span><span>文字</span>
      </button>
      <button class="tool-btn" id="addBubbleBtn" type="button" disabled>
        <span class="ico">💬</span><span>对话框</span>
      </button>
      <button class="tool-btn" id="deleteSelectedBtn" type="button" disabled>
        <span class="ico">🗑️</span><span>删除</span>
      </button>
      <button class="tool-btn" id="resetBtn" type="button" disabled>
        <span class="ico">↺</span><span>清空</span>
      </button>
    </div>

    <div class="color-row" id="colorRow">
      <div class="color-dot active" data-color="#ffffff" style="background:#ffffff;"></div>
      <div class="color-dot" data-color="#000000" style="background:#000000;"></div>
      <div class="color-dot" data-color="#ff4757" style="background:#ff4757;"></div>
      <div class="color-dot" data-color="#2ed573" style="background:#2ed573;"></div>
      <div class="color-dot" data-color="#3b7cff" style="background:#3b7cff;"></div>
      <div class="color-dot" data-color="#feca57" style="background:#feca57;"></div>
      <div class="color-dot" data-color="#a55eea" style="background:#a55eea;"></div>
    </div>

    <div class="size-row">
      <span>字号</span>
      <input type="range" id="fontSizeSlider" min="12" max="72" value="22" step="1" disabled>
      <span class="val" id="fontSizeVal">22</span>
    </div>
  </div>

  <div class="home-indicator"></div>
  <div class="toast" id="toast"></div>
</div>

<script>
(function() {
  'use strict';

  var bgImage = document.getElementById('bgImage');
  var placeholder = document.getElementById('placeholder');
  var overlayLayer = document.getElementById('overlayLayer');
  var exportBtn = document.getElementById('exportBtn');
  var fileInput = document.getElementById('fileInput');
  var importLabel = document.getElementById('importLabel');
  var addTextBtn = document.getElementById('addTextBtn');
  var addBubbleBtn = document.getElementById('addBubbleBtn');
  var deleteSelectedBtn = document.getElementById('deleteSelectedBtn');
  var resetBtn = document.getElementById('resetBtn');
  var fontSizeSlider = document.getElementById('fontSizeSlider');
  var fontSizeVal = document.getElementById('fontSizeVal');
  var colorRow = document.getElementById('colorRow');
  var toast = document.getElementById('toast');
  var editorStage = document.getElementById('editorStage');
  var canvasWrap = document.getElementById('canvasWrap');
  var loadingMask = document.getElementById('loadingMask');

  var selectedItem = null;
  var currentColor = '#ffffff';
  var currentFontSize = 22;
  var itemIdCounter = 0;

  function showToast(msg, duration) {
    duration = duration || 1800;
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toast._timer);
    toast._timer = setTimeout(function() { toast.classList.remove('show'); }, duration);
  }

  function showLoading(show) {
    loadingMask.classList.toggle('show', show);
  }

  function deselectAll() {
    var items = document.querySelectorAll('.draggable-item.selected');
    for (var i = 0; i < items.length; i++) items[i].classList.remove('selected');
    selectedItem = null;
    updateToolbarState();
  }

  function selectItem(el) {
    if (selectedItem === el) return;
    deselectAll();
    if (el) {
      el.classList.add('selected');
      selectedItem = el;
      if (el.dataset.type === 'text' || el.dataset.type === 'bubble') {
        var fs = parseInt(el.dataset.fontSize || '22', 10);
        currentFontSize = fs;
        fontSizeSlider.value = fs;
        fontSizeVal.textContent = fs;
        fontSizeSlider.disabled = false;
      }
      if (el.dataset.color) {
        currentColor = el.dataset.color;
        updateColorDots(el.dataset.color);
      }
    } else {
      fontSizeSlider.disabled = true;
      updateColorDots(currentColor);
    }
    updateToolbarState();
  }

  function updateColorDots(color) {
    var dots = document.querySelectorAll('.color-dot');
    for (var i = 0; i < dots.length; i++) {
      dots[i].classList.toggle('active', dots[i].dataset.color === color);
    }
  }

  function updateToolbarState() {
    var hasImage = canvasWrap.style.display !== 'none' && bgImage.src;
    addTextBtn.disabled = !hasImage;
    addBubbleBtn.disabled = !hasImage;
    resetBtn.disabled = !hasImage;
    deleteSelectedBtn.disabled = !selectedItem;
    if (!selectedItem) fontSizeSlider.disabled = true;
  }

  function genId() {
    return 'item_' + (++itemIdCounter) + '_' + Date.now();
  }

  // ==================== 拖拽 ====================
  function makeDraggable(el) {
    var startX = 0, startY = 0, startLeft = 0, startTop = 0;
    var isDragging = false;

    el.addEventListener('pointerdown', function(e) {
      if (e.target.closest('.delete-btn') || e.target.closest('.resize-handle')) return;
      if (el.querySelector('.editing')) return;

      e.preventDefault();
      selectItem(el);

      var wrapRect = canvasWrap.getBoundingClientRect();
      var elRect = el.getBoundingClientRect();
      startLeft = elRect.left - wrapRect.left;
      startTop = elRect.top - wrapRect.top;
      startX = e.clientX;
      startY = e.clientY;
      isDragging = true;

      try { el.setPointerCapture(e.pointerId); } catch(_) {}
      el.style.cursor = 'grabbing';
    });

    el.addEventListener('pointermove', function(e) {
      if (!isDragging) return;
      e.preventDefault();

      var dx = e.clientX - startX;
      var dy = e.clientY - startY;
      var newLeft = startLeft + dx;
      var newTop = startTop + dy;

      var wrapRect = canvasWrap.getBoundingClientRect();
      var elRect = el.getBoundingClientRect();
      var maxLeft = wrapRect.width - elRect.width + 20;
      var maxTop = wrapRect.height - elRect.height + 20;
      newLeft = Math.max(-10, Math.min(newLeft, maxLeft));
      newTop = Math.max(-10, Math.min(newTop, maxTop));

      el.style.left = newLeft + 'px';
      el.style.top = newTop + 'px';
    });

    el.addEventListener('pointerup', function(e) {
      if (!isDragging) return;
      isDragging = false;
      el.style.cursor = 'grab';
      try { el.releasePointerCapture(e.pointerId); } catch(_) {}
    });

    el.addEventListener('pointercancel', function() {
      isDragging = false;
      el.style.cursor = 'grab';
    });

    el.addEventListener('dblclick', function(e) {
      if (el.dataset.type === 'text' || el.dataset.type === 'bubble') {
        e.stopPropagation();
        startEditing(el);
      }
    });

    var lastTap = 0;
    el.addEventListener('touchend', function(e) {
      var now = Date.now();
      if (now - lastTap < 300) {
        e.preventDefault();
        if (el.dataset.type === 'text' || el.dataset.type === 'bubble') {
          startEditing(el);
        }
      }
      lastTap = now;
    }, { passive: false });
  }

  // ==================== 编辑文本 ====================
  function startEditing(el) {
    if (el.querySelector('.editing')) return;
    var contentEl = el.querySelector('.content');
    if (!contentEl) return;
    var originalText = contentEl.textContent || '';
    var editor = document.createElement('div');
    editor.className = 'editing';
    editor.contentEditable = 'true';
    editor.style.outline = 'none';
    editor.style.minWidth = '20px';
    editor.style.display = 'inline-block';
    editor.textContent = originalText;

    contentEl.style.display = 'none';
    el.appendChild(editor);
    editor.focus();

    try {
      var range = document.createRange();
      range.selectNodeContents(editor);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    } catch(_) {}

    function finish() {
      var newText = editor.innerText || editor.textContent || '';
      if (!newText.trim()) newText = '文字';
      contentEl.textContent = newText;
      contentEl.style.display = '';
      editor.remove();
      el.dataset.text = newText;
    }

    editor.addEventListener('blur', finish);
    editor.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); editor.blur(); }
      if (e.key === 'Escape') { editor.textContent = originalText; editor.blur(); }
    });
  }

  // ==================== 缩放 ====================
  function setupResize(el, handle) {
    var startX = 0, startY = 0, startSize = 0, resizing = false;

    handle.addEventListener('pointerdown', function(e) {
      e.stopPropagation();
      e.preventDefault();
      resizing = true;
      startX = e.clientX;
      startY = e.clientY;
      startSize = parseInt(el.dataset.fontSize || '22', 10);
      try { handle.setPointerCapture(e.pointerId); } catch(_) {}
    });

    handle.addEventListener('pointermove', function(e) {
      if (!resizing) return;
      e.preventDefault();
      var dx = e.clientX - startX;
      var dy = e.clientY - startY;
      var delta = Math.max(dx, dy) / 2;
      var newSize = Math.round(startSize + delta);
      newSize = Math.max(12, Math.min(96, newSize));
      el.dataset.fontSize = newSize;
      el.style.fontSize = newSize + 'px';
      if (selectedItem === el) {
        fontSizeSlider.value = newSize;
        fontSizeVal.textContent = newSize;
        currentFontSize = newSize;
      }
    });

    handle.addEventListener('pointerup', function(e) {
      resizing = false;
      try { handle.releasePointerCapture(e.pointerId); } catch(_) {}
    });
  }

  // ==================== 添加元素 ====================
  function addTextBlock(x, y, text, color, fontSize) {
    text = text || '双击编辑文字';
    color = color || currentColor;
    fontSize = fontSize || currentFontSize;
    var el = document.createElement('div');
    el.className = 'draggable-item text-block';
    el.dataset.id = genId();
    el.dataset.type = 'text';
    el.dataset.color = color;
    el.dataset.fontSize = fontSize;
    el.dataset.text = text;
    el.style.left = (x || 30) + 'px';
    el.style.top = (y || 30) + 'px';
    el.style.color = color;
    el.style.fontSize = fontSize + 'px';

    var content = document.createElement('div');
    content.className = 'content';
    content.textContent = text;
    content.style.pointerEvents = 'none';
    el.appendChild(content);

    var delBtn = document.createElement('div');
    delBtn.className = 'delete-btn';
    delBtn.textContent = '×';
    delBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      el.remove();
      if (selectedItem === el) { selectedItem = null; updateToolbarState(); }
    });
    el.appendChild(delBtn);

    var resizeHandle = document.createElement('div');
    resizeHandle.className = 'resize-handle';
    setupResize(el, resizeHandle);
    el.appendChild(resizeHandle);

    makeDraggable(el);

    el.addEventListener('pointerdown', function(e) {
      if (e.target.closest('.delete-btn') || e.target.closest('.resize-handle') || e.target.closest('.editing')) return;
      selectItem(el);
    });

    overlayLayer.appendChild(el);
    selectItem(el);
    return el;
  }

  function addBubbleBlock(x, y, text, color, fontSize) {
    text = text || '对话内容';
    color = color || currentColor;
    fontSize = fontSize || currentFontSize;
    var el = document.createElement('div');
    el.className = 'draggable-item bubble-block';
    el.dataset.id = genId();
    el.dataset.type = 'bubble';
    el.dataset.color = color;
    el.dataset.fontSize = fontSize;
    el.dataset.text = text;
    el.style.left = (x || 50) + 'px';
    el.style.top = (y || 50) + 'px';
    el.style.fontSize = fontSize + 'px';

    function applyBubbleColor(bgColor) {
      var hex = bgColor.replace('#', '');
      var r = parseInt(hex.substr(0,2), 16);
      var g = parseInt(hex.substr(2,2), 16);
      var b = parseInt(hex.substr(4,2), 16);
      var brightness = (r*299 + g*587 + b*114) / 1000;
      el.style.background = bgColor;
      el.style.color = brightness > 128 ? '#1a1d21' : '#ffffff';
    }
    applyBubbleColor(color);

    var content = document.createElement('div');
    content.className = 'content';
    content.textContent = text;
    content.style.pointerEvents = 'none';
    el.appendChild(content);

    var delBtn = document.createElement('div');
    delBtn.className = 'delete-btn';
    delBtn.textContent = '×';
    delBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      el.remove();
      if (selectedItem === el) { selectedItem = null; updateToolbarState(); }
    });
    el.appendChild(delBtn);

    var resizeHandle = document.createElement('div');
    resizeHandle.className = 'resize-handle';
    setupResize(el, resizeHandle);
    el.appendChild(resizeHandle);

    makeDraggable(el);

    el.addEventListener('pointerdown', function(e) {
      if (e.target.closest('.delete-btn') || e.target.closest('.resize-handle') || e.target.closest('.editing')) return;
      selectItem(el);
    });

    overlayLayer.appendChild(el);
    selectItem(el);
    return el;
  }

  // ==================== ★ 安卓 Chrome 专用：文件导入 ====================
  fileInput.addEventListener('change', function(e) {
    console.log('[导入] change 触发');

    var file = e.target.files && e.target.files[0];
    if (!file) {
      console.log('[导入] 没有选择文件');
      return;
    }

    console.log('[导入] 文件:', file.name, file.type, file.size);

    if (!file.type.match(/^image\//)) {
      showToast('请选择图片文件');
      return;
    }

    showLoading(true);

    var reader = new FileReader();

    reader.onload = function(ev) {
      console.log('[导入] FileReader 完成');

      // 用临时 Image 检测能否成功加载
      var tempImg = new Image();

      tempImg.onload = function() {
        console.log('[导入] Image 加载成功', tempImg.naturalWidth, 'x', tempImg.naturalHeight);

        // 赋值到实际 img
        bgImage.src = tempImg.src;

        // ★ 关键：用 requestAnimationFrame 等图片真正渲染完成
        requestAnimationFrame(function() {
          // 隐藏 placeholder，显示 canvas-wrap
          placeholder.style.display = 'none';
          canvasWrap.style.display = 'inline-block';

          // 清空旧的 overlay
          overlayLayer.innerHTML = '';
          selectedItem = null;

          // 等图片实际有尺寸后再更新状态
          setTimeout(function() {
            showLoading(false);
            updateToolbarState();
            showToast('✅ 图片已导入，点击"文字"或"对话框"开始编辑');
            console.log('[导入] 完成，图片尺寸:', bgImage.clientWidth, 'x', bgImage.clientHeight);
          }, 50);
        });
      };

      tempImg.onerror = function() {
        console.error('[导入] Image 加载失败');
        showLoading(false);
        showToast('图片加载失败，请换一张');
      };

      tempImg.src = ev.target.result;
    };

    reader.onerror = function(err) {
      console.error('[导入] FileReader 错误', err);
      showLoading(false);
      showToast('读取文件失败');
    };

    reader.readAsDataURL(file);

    // 清空 input（延迟，确保事件已经处理完）
    setTimeout(function() {
      fileInput.value = '';
      console.log('[导入] input 已清空');
    }, 500);
  });

  // ★ 安卓 Chrome 额外保险：有些机型 label 点击不会自动触发 input
  // 给 label 添加 click 事件，手动触发 input.click()
  importLabel.addEventListener('click', function(e) {
    console.log('[导入] label 被点击，target:', e.target.tagName);
    // 如果点击的是 input 本身，让浏览器自己处理
    if (e.target === fileInput) {
      console.log('[导入] 点击的是 input，跳过');
      return;
    }
    // 否则手动触发 input 点击
    try {
      fileInput.click();
      console.log('[导入] 手动触发 input.click()');
    } catch (err) {
      console.error('[导入] input.click() 失败:', err);
    }
  });

  // ==================== 添加按钮 ====================
  addTextBtn.addEventListener('click', function() {
    if (canvasWrap.style.display === 'none') { showToast('请先导入图片'); return; }
    addTextBlock(40, 40, '双击编辑文字', currentColor, currentFontSize);
    showToast('已添加文字，双击可编辑');
  });

  addBubbleBtn.addEventListener('click', function() {
    if (canvasWrap.style.display === 'none') { showToast('请先导入图片'); return; }
    addBubbleBlock(60, 60, '对话内容', currentColor, currentFontSize);
    showToast('已添加对话框，双击可编辑');
  });

  deleteSelectedBtn.addEventListener('click', function() {
    if (selectedItem) {
      selectedItem.remove();
      selectedItem = null;
      updateToolbarState();
      showToast('已删除');
    }
  });

  resetBtn.addEventListener('click', function() {
    if (!overlayLayer.children.length) { showToast('没有可清空的内容'); return; }
    if (confirm('确定清空所有文字和对话框吗？')) {
      overlayLayer.innerHTML = '';
      selectedItem = null;
      updateToolbarState();
      showToast('已清空');
    }
  });

  // 颜色
  colorRow.addEventListener('click', function(e) {
    var dot = e.target.closest('.color-dot');
    if (!dot) return;
    var color = dot.dataset.color;
    currentColor = color;
    updateColorDots(color);

    if (selectedItem) {
      selectedItem.dataset.color = color;
      if (selectedItem.dataset.type === 'text') {
        selectedItem.style.color = color;
      } else if (selectedItem.dataset.type === 'bubble') {
        var hex = color.replace('#','');
        var r = parseInt(hex.substr(0,2),16);
        var g = parseInt(hex.substr(2,2),16);
        var b = parseInt(hex.substr(4,2),16);
        var brightness = (r*299 + g*587 + b*114) / 1000;
        selectedItem.style.background = color;
        selectedItem.style.color = brightness > 128 ? '#1a1d21' : '#ffffff';
      }
    }
  });

  // 字号滑块
  fontSizeSlider.addEventListener('input', function() {
    var size = parseInt(fontSizeSlider.value, 10);
    currentFontSize = size;
    fontSizeVal.textContent = size;
    if (selectedItem && (selectedItem.dataset.type === 'text' || selectedItem.dataset.type === 'bubble')) {
      selectedItem.dataset.fontSize = size;
      selectedItem.style.fontSize = size + 'px';
    }
  });

  // 点击空白取消选中
  editorStage.addEventListener('pointerdown', function(e) {
    if (e.target === editorStage || e.target === placeholder) {
      deselectAll();
    }
  });

  // ==================== 导出图片 ====================
  exportBtn.addEventListener('click', function() {
    if (canvasWrap.style.display === 'none' || !bgImage.src) {
      showToast('请先导入图片');
      return;
    }

    showToast('正在生成…', 2000);

    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function() {
      var canvas = document.createElement('canvas');
      var ctx = canvas.getContext('2d');
      var W = img.naturalWidth;
      var H = img.naturalHeight;
      canvas.width = W;
      canvas.height = H;
      ctx.drawImage(img, 0, 0, W, H);

      var imgRect = bgImage.getBoundingClientRect();
      var wrapRect = canvasWrap.getBoundingClientRect();
      var scaleX = W / imgRect.width;
      var scaleY = H / imgRect.height;
      var offsetX = imgRect.left - wrapRect.left;
      var offsetY = imgRect.top - wrapRect.top;

      var items = overlayLayer.querySelectorAll('.draggable-item');
      for (var i = 0; i < items.length; i++) {
        var el = items[i];
        var elRect = el.getBoundingClientRect();
        var x = (elRect.left - wrapRect.left - offsetX) * scaleX;
        var y = (elRect.top - wrapRect.top - offsetY) * scaleY;
        var fontSize = parseInt(el.dataset.fontSize || '22', 10) * scaleY;
        var text = el.dataset.text || '';
        var color = el.dataset.color || '#ffffff';
        var type = el.dataset.type;

        if (type === 'text') {
          ctx.font = '700 ' + fontSize + 'px system-ui, -apple-system, sans-serif';
          ctx.fillStyle = color;
          ctx.textBaseline = 'top';
          ctx.shadowColor = 'rgba(0,0,0,0.6)';
          ctx.shadowBlur = 8 * scaleY;
          ctx.shadowOffsetY = 2 * scaleY;
          var lines = text.split('\n');
          var lineHeight = fontSize * 1.25;
          for (var j = 0; j < lines.length; j++) {
            ctx.fillText(lines[j], x + 10 * scaleX, y + 6 * scaleY + j * lineHeight);
          }
          ctx.shadowColor = 'transparent';
          ctx.shadowBlur = 0;
          ctx.shadowOffsetY = 0;
        } else if (type === 'bubble') {
          var padX = 16 * scaleX;
          var padY = 12 * scaleY;
          var bw = elRect.width * scaleX;
          var bh = elRect.height * scaleY;
          var radius = 20 * scaleX;

          ctx.save();
          ctx.shadowColor = 'rgba(0,0,0,0.3)';
          ctx.shadowBlur = 12 * scaleY;
          ctx.shadowOffsetY = 4 * scaleY;
          ctx.fillStyle = color;
          ctx.beginPath();
          roundRect(ctx, x, y, bw, bh, radius);
          ctx.fill();
          ctx.restore();

          var hex = color.replace('#','');
          var r = parseInt(hex.substr(0,2),16);
          var g = parseInt(hex.substr(2,2),16);
          var b = parseInt(hex.substr(4,2),16);
          var brightness = (r*299 + g*587 + b*114) / 1000;
          ctx.fillStyle = brightness > 128 ? '#1a1d21' : '#ffffff';
          ctx.font = '600 ' + fontSize + 'px system-ui, -apple-system, sans-serif';
          ctx.textBaseline = 'top';
          var lines2 = text.split('\n');
          var lh2 = fontSize * 1.4;
          for (var k = 0; k < lines2.length; k++) {
            ctx.fillText(lines2[k], x + padX, y + padY + k * lh2);
          }
        }
      }

      try {
        var dataUrl = canvas.toDataURL('image/png');
        var a = document.createElement('a');
        a.href = dataUrl;
        a.download = 'edited_' + Date.now() + '.png';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showToast('✅ 已导出到相册/下载');
      } catch (err) {
        showToast('导出失败：' + err.message);
      }
    };
    img.onerror = function() {
      showToast('导出失败，图片加载错误');
    };
    img.src = bgImage.src;
  });

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  updateToolbarState();
  console.log('[初始化] 编辑器已就绪，使用安卓 Chrome 优化版本');
})();
</script>
</body>
