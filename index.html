<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fish TTS · 语音合成</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0a0a0f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            color: #e0e0e0;
        }

        .phone-frame {
            width: 100%;
            max-width: 375px;
            height: 812px;
            max-height: 90vh;
            background: #12121a;
            border-radius: 40px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.06);
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* 顶部状态栏占位 */
        .status-bar {
            height: 44px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: #666;
            padding: 0 8px;
            margin-bottom: 8px;
            flex-shrink: 0;
        }

        .status-bar .time {
            font-weight: 600;
            color: #aaa;
        }

        .status-bar .icons {
            display: flex;
            gap: 6px;
            font-size: 12px;
        }

        /* 标题区域 */
        .header {
            text-align: center;
            margin-bottom: 28px;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 600;
            color: #f0f0f0;
            letter-spacing: 0.5px;
        }

        .header h1 span {
            color: #6c5ce7;
        }

        .header p {
            font-size: 12px;
            color: #555;
            margin-top: 6px;
            font-weight: 400;
        }

        /* 文本输入区 */
        .input-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .textarea-wrapper {
            position: relative;
            flex: 1;
            min-height: 120px;
            margin-bottom: 16px;
        }

        textarea {
            width: 100%;
            height: 100%;
            background: #1a1a24;
            border: 1.5px solid #2a2a3a;
            border-radius: 16px;
            padding: 16px;
            font-size: 15px;
            color: #ddd;
            resize: none;
            outline: none;
            font-family: inherit;
            line-height: 1.6;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
            min-height: 120px;
        }

        textarea:focus {
            border-color: #6c5ce7;
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.15);
        }

        textarea::placeholder {
            color: #444;
        }

        .char-count {
            position: absolute;
            bottom: 12px;
            right: 16px;
            font-size: 11px;
            color: #444;
            pointer-events: none;
        }

        /* 按钮组 */
        .btn-group {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            flex-shrink: 0;
        }

        .btn {
            flex: 1;
            padding: 14px 0;
            border-radius: 14px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            letter-spacing: 0.3px;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6c5ce7, #5a4bd1);
            color: #fff;
            box-shadow: 0 4px 16px rgba(108, 92, 231, 0.3);
        }

        .btn-primary:active:not(:disabled) {
            box-shadow: 0 2px 8px rgba(108, 92, 231, 0.4);
        }

        .btn-secondary {
            background: #1e1e2a;
            color: #aaa;
            border: 1.5px solid #2a2a3a;
        }

        .btn-secondary:active:not(:disabled) {
            background: #252535;
        }

        /* 音频播放器区域 */
        .audio-section {
            flex-shrink: 0;
            background: #1a1a24;
            border-radius: 16px;
            padding: 16px;
            border: 1.5px solid #2a2a3a;
            display: none;
            animation: slideUp 0.3s ease;
        }

        .audio-section.visible {
            display: block;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .audio-label {
            font-size: 11px;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        audio {
            width: 100%;
            height: 40px;
            border-radius: 10px;
            outline: none;
            filter: invert(0.9) hue-rotate(180deg);
        }

        .download-link {
            display: block;
            text-align: center;
            margin-top: 10px;
            font-size: 12px;
            color: #6c5ce7;
            text-decoration: none;
            font-weight: 500;
        }

        .download-link:active {
            opacity: 0.7;
        }

        /* 加载状态 */
        .loading {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            color: #888;
            font-size: 13px;
        }

        .loading.visible {
            display: flex;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid #2a2a3a;
            border-top-color: #6c5ce7;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 错误提示 */
        .error-toast {
            display: none;
            background: rgba(220, 60, 60, 0.15);
            border: 1px solid rgba(220, 60, 60, 0.3);
            color: #e88;
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 12px;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .error-toast.visible {
            display: block;
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* 底部 */
        .footer {
            flex-shrink: 0;
            text-align: center;
            padding-top: 12px;
            border-top: 1px solid #1e1e2a;
            margin-top: auto;
        }

        .footer p {
            font-size: 10px;
            color: #333;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <!-- 状态栏 -->
        <div class="status-bar">
            <span class="time">9:41</span>
            <div class="icons">
                <span>📶</span>
                <span>🔋</span>
            </div>
        </div>

        <!-- 头部 -->
        <div class="header">
            <h1>Fish <span>TTS</span></h1>
            <p>输入文字 · 生成语音</p>
        </div>

        <!-- 输入区 -->
        <div class="input-section">
            <div class="textarea-wrapper">
                <textarea id="textInput" placeholder="在这里输入你想转换为语音的文字…" maxlength="2000">你好，欢迎使用 Fish TTS 语音合成服务。</textarea>
                <span class="char-count" id="charCount">0 / 2000</span>
            </div>

            <!-- 错误提示 -->
            <div class="error-toast" id="errorToast"></div>

            <!-- 按钮组 -->
            <div class="btn-group">
                <button class="btn btn-primary" id="generateBtn">生成语音</button>
                <button class="btn btn-secondary" id="clearBtn">清空</button>
            </div>

            <!-- 加载状态 -->
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <span>正在合成语音…</span>
            </div>

            <!-- 音频播放 -->
            <div class="audio-section" id="audioSection">
                <div class="audio-label">合成结果</div>
                <audio id="audioPlayer" controls preload="auto"></audio>
                <a class="download-link" id="downloadLink" download="fish-tts-output.mp3">⬇ 下载音频文件</a>
            </div>
        </div>

        <!-- 底部 -->
        <div class="footer">
            <p>Powered by Fish Audio S2.1 Pro</p>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            // 配置区：请填入你的 Fish Audio API Key
            // 获取地址：https://fish.audio 注册后在开发者面板创建
            // ============================================================
            const API_KEY = 'YOUR_FISH_AUDIO_API_KEY';  // ← 替换为你的 API Key
            const API_URL = 'https://api.fish.audio/v1/tts';
            const MODEL = 's2.1-pro';  // 可选：s2.1-pro / s2-pro / s1
            
            // 可选：指定参考声音 ID（留空则使用默认声音）
            // 在 Fish Audio 的 Voice Library 中查找 voice model id
            const REFERENCE_ID = ''; 

            // ============================================================
            // DOM 引用
            // ============================================================
            const textInput = document.getElementById('textInput');
            const charCount = document.getElementById('charCount');
            const generateBtn = document.getElementById('generateBtn');
            const clearBtn = document.getElementById('clearBtn');
            const loading = document.getElementById('loading');
            const audioSection = document.getElementById('audioSection');
            const audioPlayer = document.getElementById('audioPlayer');
            const downloadLink = document.getElementById('downloadLink');
            const errorToast = document.getElementById('errorToast');

            let currentAudioUrl = null;

            // ============================================================
            // 字符计数
            // ============================================================
            function updateCharCount() {
                const len = textInput.value.length;
                charCount.textContent = len + ' / 2000';
            }

            textInput.addEventListener('input', updateCharCount);
            updateCharCount();

            // ============================================================
            // 工具函数
            // ============================================================
            function showError(msg) {
                errorToast.textContent = msg;
                errorToast.classList.add('visible');
                setTimeout(() => {
                    errorToast.classList.remove('visible');
                }, 6000);
            }

            function hideError() {
                errorToast.classList.remove('visible');
            }

            function setLoading(isLoading) {
                if (isLoading) {
                    loading.classList.add('visible');
                    generateBtn.disabled = true;
                    generateBtn.textContent = '合成中…';
                } else {
                    loading.classList.remove('visible');
                    generateBtn.disabled = false;
                    generateBtn.textContent = '生成语音';
                }
            }

            function revokeOldUrl() {
                if (currentAudioUrl) {
                    URL.revokeObjectURL(currentAudioUrl);
                    currentAudioUrl = null;
                }
            }

            // ============================================================
            // 核心合成逻辑
            // ============================================================
            async function generateSpeech() {
                const text = textInput.value.trim();

                if (!text) {
                    showError('请输入要合成的文字内容。');
                    textInput.focus();
                    return;
                }

                if (text.length > 2000) {
                    showError('文字长度不能超过 2000 个字符。');
                    return;
                }

                if (!API_KEY || API_KEY === 'YOUR_FISH_AUDIO_API_KEY') {
                    showError('请先在代码中填入你的 Fish Audio API Key。');
                    return;
                }

                hideError();
                setLoading(true);

                // 清理旧音频
                revokeOldUrl();
                audioSection.classList.remove('visible');
                audioPlayer.removeAttribute('src');
                audioPlayer.load();

                try {
                    const payload = {
                        text: text,
                        format: 'mp3',
                    };

                    // 如果有配置参考声音 ID 则带上
                    if (REFERENCE_ID) {
                        payload.reference_id = REFERENCE_ID;
                    }

                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: {
                            'Authorization': 'Bearer ' + API_KEY,
                            'Content-Type': 'application/json',
                            'model': MODEL
                        },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        let errMsg = 'API 请求失败（状态码 ' + response.status + '）';
                        try {
                            const errBody = await response.json();
                            if (errBody && errBody.message) {
                                errMsg += '：' + errBody.message;
                            } else if (errBody && errBody.detail) {
                                errMsg += '：' + errBody.detail;
                            }
                        } catch (e) {
                            // 无法解析错误体时使用默认消息
                        }
                        throw new Error(errMsg);
                    }

                    // 获取音频二进制数据
                    const audioBlob = await response.blob();

                    if (audioBlob.size === 0) {
                        throw new Error('返回的音频数据为空，请检查输入内容或 API 配置。');
                    }

                    // 创建对象 URL 并播放
                    currentAudioUrl = URL.createObjectURL(audioBlob);
                    audioPlayer.src = currentAudioUrl;
                    downloadLink.href = currentAudioUrl;

                    // 显示播放器区域
                    audioSection.classList.add('visible');

                    // 自动尝试播放（部分浏览器会因策略阻止，但控件可手动播放）
                    try {
                        await audioPlayer.play();
                    } catch (playErr) {
                        // 自动播放被阻止，静默忽略，用户可点击播放按钮
                        console.log('自动播放被阻止，用户可手动点击播放。');
                    }

                } catch (err) {
                    console.error('TTS 合成错误:', err);
                    showError('合成失败：' + err.message);
                } finally {
                    setLoading(false);
                }
            }

            // ============================================================
            // 事件绑定
            // ============================================================
            generateBtn.addEventListener('click', generateSpeech);

            clearBtn.addEventListener('click', function() {
                textInput.value = '';
                updateCharCount();
                hideError();

                // 清理音频
                revokeOldUrl();
                audioSection.classList.remove('visible');
                audioPlayer.removeAttribute('src');
                audioPlayer.load();

                textInput.focus();
            });

            // Ctrl/Cmd + Enter 快捷生成
            textInput.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    generateSpeech();
                }
            });

            // 页面关闭时释放对象 URL
            window.addEventListener('beforeunload', revokeOldUrl);

        })();
    </script>
</body>
</html>
