<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>图片文字 · 对话框编辑器 Pro</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=Noto+Serif+SC:wght@400;700&family=ZCOOL+KuaiLe&family=ZCOOL+QingKe+HuangYou&family=Ma+Shan+Zheng&family=Long+Cang&family=Zhi+Mang+Xing&family=Liu+Jian+Mao+Cao&family=Roboto:wght@400;700&family=Playfair+Display:wght@700&family=Pacifico&family=Bebas+Neue&display=swap" rel="stylesheet">

<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    background:#0b0d10; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family: system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; padding:12px; overflow:hidden;
  }
  .phone-frame {
    width:390px; max-width:100%; height:780px; max-height:94vh; background:#111315;
    border-radius:44px;
    box-shadow: 0 30px 50px rgba(0,0,0,0.8), 0 0 0 8px #1e2023, 0 0 0 12px #2a2d31;
    overflow:hidden; display:flex; flex-direction:column; position:relative;
  }
  .status-bar {
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 24px 8px 24px; color:#f0f0f0; font-size:15px; font-weight:500; flex-shrink:0;
  }
  .app-bar {
    display:flex; align-items:center; justify-content:space-between;
    padding:4px 20px 12px 20px; flex-shrink:0;
  }
  .app-bar h1 { font-size:19px; font-weight:700; color:#f0f3f7; letter-spacing:-0.3px; }
  .app-bar .actions { display:flex; gap:8px; }

  .btn {
    border:none; outline:none; cursor:pointer; font-family:inherit; font-weight:600;
    border-radius:40px; transition:transform .15s ease;
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    user-select:none; text-decoration:none;
  }
  .btn:active { transform:scale(0.94); }
  .btn-sm { padding:8px 14px; font-size:13px; background:#2c3138; color:#e0e6ed; }
  .btn-primary { background:#3b7cff; color:#fff; padding:10px 18px; font-size:14px;
    box-shadow:0 4px 12px rgba(59,124,255,.4); }

  .import-label {
    position: relative; display: inline-flex; align-items: center; justify-content: center;
    gap: 6px; padding: 8px 14px; font-size: 13px; font-weight: 600;
    background: #2c3138; color: #e0e6ed; border-radius: 40px; cursor: pointer;
    overflow: hidden; pointer-events: auto;
  }
  .import-label:active { transform:scale(0.94); }
  .import-label input[type="file"] {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    opacity: 0; cursor: pointer; pointer-events: auto; font-size: 100px;
  }

  .editor-stage {
    flex:1; position:relative; overflow:hidden;
    margin:0 16px; border-radius:24px; border:1px solid #23272d;
    display:flex; align-items:center; justify-content:center;
    background-image:
      linear-gradient(45deg,#14171b 25%,transparent 25%),
      linear-gradient(-45deg,#14171b 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#14171b 75%),
      linear-gradient(-45deg,transparent 75%,#14171b 75%);
    background-size:20px 20px;
    background-position:0 0,0 10px,10px -10px,-10px 0px;
    background-color:#0f1114;
    min-height: 0;
  }

  .canvas-wrap {
    position:relative;
    display:inline-block;
    line-height:0;
    max-width:100%;
    max-height:100%;
  }

  #bgImage {
    display:block;
    max-width:100%;
    max-height:100%;
    width:auto;
    height:auto;
    object-fit:contain;
    pointer-events:none;
    border-radius:8px;
    box-shadow:0 8px 30px rgba(0,0,0,.6);
  }

  .placeholder {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#5a6371; gap:12px; padding:40px; text-align:center; pointer-events:none;
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  }
  .placeholder .icon { font-size:52px; opacity:.6; }
  .placeholder .text { font-size:14px; line-height:1.5; font-weight:500; }

  .overlay-layer {
    position:absolute; top:0; left:0; width:100%; height:100%;
    pointer-events:none; overflow:visible; border-radius:8px;
  }

  .draggable-item {
    position:absolute; pointer-events:auto; cursor:grab;
    user-select:none; touch-action:none; z-index:10;
  }
  .draggable-item.selected {
    z-index:20;
    outline:2px solid #3b7cff;
    outline-offset:4px;
  }

  /* 文字块 */
  .text-block {
    min-width:40px; padding:6px 10px;
    font-weight:700; font-size:22px; line-height:1.25;
    text-shadow:0 2px 8px rgba(0,0,0,.6);
    white-space:pre-wrap; word-break:break-word; outline:none;
    border-radius:6px;
  }

  /* 对话框 */
  .bubble-block {
    min-width:60px; padding:12px 16px;
    font-weight:600; font-size:16px; line-height:1.4;
    word-break:break-word; position:relative; white-space:pre-wrap;
    outline:none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .bubble-block .content { width: 100%; }

  .shape-rounded { border-radius: 20px; }
  .shape-rect { border-radius: 8px; }
  .shape-circle { border-radius: 50%; }
  .shape-ellipse { border-radius: 50%; }
  .shape-thought {
    border-radius: 50%; position: relative;
  }
  .shape-thought::before {
    content:''; position:absolute; bottom:-10px; left:15px;
    width:16px; height:16px; border-radius:50%;
    background: inherit;
  }
  .shape-thought::after {
    content:''; position:absolute; bottom:-24px; left:2px;
    width:10px; height:10px; border-radius:50%;
    background: inherit;
  }
  .shape-narration {
    border-radius: 0;
    border-left-width: 4px !important;
  }
  .shape-exclaim {
    position: relative;
    clip-path: polygon(
      0% 10%, 8% 0%, 22% 6%, 35% 0%, 50% 7%, 65% 0%, 78% 6%, 92% 0%, 100% 10%,
      94% 25%, 100% 40%, 92% 55%, 100% 70%, 92% 85%, 100% 100%, 85% 94%,
      70% 100%, 55% 93%, 40% 100%, 25% 93%, 10% 100%, 0% 90%,
      7% 75%, 0% 60%, 7% 45%, 0% 30%, 7% 15%
    );
  }

  /* ★★★ 可调粗细和倾斜的三角形尾巴（用 CSS 变量控制） ★★★ */
  .bubble-block::after {
    content: '';
    position: absolute;
    width: 0;
    height: 0;
    display: none;
    /* 由 CSS 变量控制：--tail-size（粗细）、--tail-skew（倾斜度） */
    transform: rotate(var(--tail-rotate, 0deg));
  }

  .tail-bottom-left::after {
    display: block;
    bottom: calc(-1 * var(--tail-size, 14px));
    left: 22px;
    border-left: var(--tail-size, 14px) solid transparent;
    border-right: var(--tail-size, 14px) solid transparent;
    border-top: var(--tail-size, 14px) solid var(--tail-color, #ffffff);
    transform: skewX(var(--tail-skew, 0deg));
    transform-origin: top left;
  }
  .tail-bottom-right::after {
    display: block;
    bottom: calc(-1 * var(--tail-size, 14px));
    right: 22px;
    border-left: var(--tail-size, 14px) solid transparent;
    border-right: var(--tail-size, 14px) solid transparent;
    border-top: var(--tail-size, 14px) solid var(--tail-color, #ffffff);
    transform: skewX(var(--tail-skew, 0deg));
    transform-origin: top right;
  }
  .tail-top-left::after {
    display: block;
    top: calc(-1 * var(--tail-size, 14px));
    left: 22px;
    border-left: var(--tail-size, 14px) solid transparent;
    border-right: var(--tail-size, 14px) solid transparent;
    border-bottom: var(--tail-size, 14px) solid var(--tail-color, #ffffff);
    transform: skewX(var(--tail-skew, 0deg));
    transform-origin: bottom left;
  }
  .tail-top-right::after {
    display: block;
    top: calc(-1 * var(--tail-size, 14px));
    right: 22px;
    border-left: var(--tail-size, 14px) solid transparent;
    border-right: var(--tail-size, 14px) solid transparent;
    border-bottom: var(--tail-size, 14px) solid var(--tail-color, #ffffff);
    transform: skewX(var(--tail-skew, 0deg));
    transform-origin: bottom right;
  }
  .tail-left::after {
    display: block;
    left: calc(-1 * var(--tail-size, 14px));
    top: 50%;
    margin-top: calc(-1 * var(--tail-size, 14px) / 2);
    border-top: var(--tail-size, 14px) solid transparent;
    border-bottom: var(--tail-size, 14px) solid transparent;
    border-right: var(--tail-size, 14px) solid var(--tail-color, #ffffff);
    transform: skewY(var(--tail-skew, 0deg));
    transform-origin: right center;
  }
  .tail-right::after {
    display: block;
    right: calc(-1 * var(--tail-size, 14px));
    top: 50%;
    margin-top: calc(-1 * var(--tail-size, 14px) / 2);
    border-top: var(--tail-size, 14px) solid transparent;
    border-bottom: var(--tail-size, 14px) solid transparent;
    border-left: var(--tail-size, 14px) solid var(--tail-color, #ffffff);
    transform: skewY(var(--tail-skew, 0deg));
    transform-origin: left center;
  }
  .tail-none::after { display: none !important; }

  .resize-handle {
    position:absolute; width:22px; height:22px; background:#3b7cff;
    border:3px solid #fff; border-radius:50%; bottom:-12px; right:-12px;
    cursor:nwse-resize; pointer-events:auto;
    box-shadow:0 2px 8px rgba(0,0,0,.5); touch-action:none; z-index:25;
    display:none;
  }
  .draggable-item.selected .resize-handle { display:block; }

  .delete-btn {
    position:absolute; width:24px; height:24px; background:#e5484d; color:#fff;
    border:2px solid #fff; border-radius:50%; top:-12px; right:-12px;
    cursor:pointer; pointer-events:auto; display:none;
    align-items:center; justify-content:center; font-size:14px; font-weight:700;
    line-height:1; box-shadow:0 2px 8px rgba(0,0,0,.5); z-index:25;
  }
  .draggable-item.selected .delete-btn { display:flex; }

  /* ============ 工具栏 ============ */
  .toolbar {
    flex-shrink:0; padding:10px 16px 6px 16px;
    display:flex; flex-direction:column; gap:8px;
    max-height: 48vh; overflow-y: auto;
  }
  .tool-row { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; }
  .tool-btn {
    display:flex; flex-direction:column; align-items:center; gap:2px;
    background:#1e2227; border:1px solid #2e3238; border-radius:14px;
    padding:6px 10px; color:#cbd5e1; font-size:10px; font-weight:600;
    cursor:pointer; transition:all .15s ease; min-width:52px;
    font-family:inherit;
  }
  .tool-btn:active { transform:scale(0.94); }
  .tool-btn .ico { font-size:16px; line-height:1; }
  .tool-btn:disabled { opacity:.4; pointer-events:none; }

  /* 样式滚动条 */
  .style-scroll {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 4px 2px;
    scrollbar-width: none;
  }
  .style-scroll::-webkit-scrollbar { display: none; }
  .style-chip {
    flex-shrink: 0;
    padding: 6px 12px;
    border-radius: 20px;
    background: #1e2227;
    border: 1px solid #2e3238;
    color: #cbd5e1;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }
  .style-chip.active {
    background: #3b7cff;
    border-color: #3b7cff;
    color: #fff;
  }

  /* ============ 折叠面板 ============ */
  .panel {
    background: #181c21;
    border-radius: 14px;
    border: 1px solid #262a30;
    overflow: hidden;
  }
  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    cursor: pointer;
    user-select: none;
    color: #cbd5e1;
    font-size: 12px;
    font-weight: 600;
  }
  .panel-header:active { background: #1f242b; }
  .panel-header .arrow {
    color: #6e7887;
    font-size: 12px;
    transition: transform 0.2s ease;
  }
  .panel.open .panel-header .arrow {
    transform: rotate(180deg);
  }
  .panel-body {
    display: none;
    padding: 0 12px 12px 12px;
    flex-direction: column;
    gap: 10px;
  }
  .panel.open .panel-body { display: flex; }

  /* 面板底部取消按钮 */
  .panel-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    padding-top: 8px;
    border-top: 1px solid #262a30;
    margin-top: 4px;
  }
  .btn-cancel {
    padding: 6px 14px;
    font-size: 11px;
    font-weight: 600;
    border-radius: 20px;
    border: 1px solid #3a4048;
    background: transparent;
    color: #a0aab8;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-cancel:active { background: #2a3038; }
  .btn-apply {
    padding: 6px 14px;
    font-size: 11px;
    font-weight: 600;
    border-radius: 20px;
    border: none;
    background: #3b7cff;
    color: #fff;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-apply:active { background: #2e6bef; }

  .section-label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 6px;
    color: #8e98a6;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.3px;
    margin-top: 4px;
  }

  .color-row { display:flex; gap:6px; justify-content:center; align-items:center; flex-wrap:wrap; }
  .color-dot {
    width:24px; height:24px; border-radius:50%; cursor:pointer;
    border:2px solid transparent; transition:all .15s ease; flex-shrink:0;
    position: relative;
  }
  /* ★★★ 颜色选中标记：白色圆环 + 蓝色外圈 + 对勾 ★★★ */
  .color-dot.active {
    border-color: #ffffff;
    box-shadow: 0 0 0 2px #3b7cff, 0 0 0 4px rgba(59,124,255,.4);
  }
  .color-dot.active::before {
    content: '✓';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #fff;
    font-size: 13px;
    font-weight: 900;
    text-shadow: 0 1px 3px rgba(0,0,0,.9), 0 0 4px rgba(0,0,0,.6);
    pointer-events: none;
  }
  .color-dot.active[data-color="#ffffff"]::before,
  .color-dot.active[data-bg-color="#ffffff"]::before,
  .color-dot.active[data-border-color="#ffffff"]::before,
  .color-dot.active[data-bg-color="#feca57"]::before,
  .color-dot.active[data-border-color="#feca57"]::before,
  .color-dot.active[data-color="#feca57"]::before {
    color: #1a1d21;
    text-shadow: 0 1px 2px rgba(255,255,255,.5);
  }

  .color-dot.custom {
    background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red);
  }
  .color-dot.custom::after {
    content:'+';
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    color:#fff;
    font-weight:700;
    font-size:14px;
    text-shadow:0 1px 2px rgba(0,0,0,.8);
  }
  .color-dot.custom.active::before { content: '✓'; }

  .slider-row {
    display:flex; align-items:center; gap:8px; padding:0 6px;
    color:#8e98a6; font-size:11px;
  }
  .slider-row .lbl { min-width: 52px; color: #a0aab8; font-weight: 600; }
  .slider-row input[type="range"] {
    flex:1; -webkit-appearance:none; appearance:none; height:4px;
    background:#2e3238; border-radius:2px; outline:none;
  }
  .slider-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance:none; width:16px; height:16px; border-radius:50%;
    background:#3b7cff; cursor:pointer; box-shadow:0 2px 6px rgba(59,124,255,.5);
  }
  .slider-row .val { min-width:36px; text-align:right; color:#e0e6ed; font-weight:600; font-variant-numeric: tabular-nums; }

  /* 字体弹层 */
  .font-picker-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    z-index: 300;
    align-items: flex-end;
  }
  .font-picker-overlay.show { display: flex; }
  .font-picker {
    background: #1a1e23;
    border-radius: 24px 24px 0 0;
    padding: 16px;
    width: 100%;
    max-height: 65%;
    overflow-y: auto;
    border-top: 1px solid #2e3238;
    animation: slideUp 0.2s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .font-picker h3 {
    color: #e0e6ed;
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .font-picker h3 .close {
    cursor: pointer;
    font-size: 18px;
    color: #8e98a6;
    padding: 4px 8px;
  }
  .font-list {
    display: grid;
    grid-template-columns: 1fr;
    gap: 6px;
  }
  .font-option {
    padding: 12px 16px;
    border-radius: 12px;
    background: #242a32;
    border: 1px solid #2e3238;
    color: #e0e6ed;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .font-option.active {
    border-color: #3b7cff;
    background: #2a3441;
  }
  .font-option .check {
    color: #3b7cff;
    font-weight: 700;
    display: none;
  }
  .font-option.active .check { display: block; }

  .home-indicator {
    margin:4px auto 8px; width:130px; height:5px; background:#3d424a;
    border-radius:40px; opacity:.7; flex-shrink:0;
  }

  .toast {
    position:absolute; bottom:100px; left:50%;
    transform:translateX(-50%) translateY(20px);
    background:rgba(0,0,0,.85); color:#fff; padding:10px 20px;
    border-radius:40px; font-size:13px; font-weight:500; opacity:0;
    pointer-events:none; transition:all .3s ease; z-index:100;
    white-space:nowrap;
    border:1px solid rgba(255,255,255,.1);
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  .loading-mask {
    position:absolute; top:0; left:0; width:100%; height:100%;
    background:rgba(0,0,0,.6); display:none;
    align-items:center; justify-content:center; z-index:200;
    color:#fff; font-size:14px; font-weight:500;
    flex-direction: column; gap: 12px;
  }
  .loading-mask.show { display:flex; }
  .loading-spinner {
    width: 32px; height: 32px;
    border: 3px solid rgba(255,255,255,.2);
    border-top-color: #3b7cff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width:420px) {
    .phone-frame { height:95vh; border-radius:36px;
      box-shadow:0 20px 40px rgba(0,0,0,.9),0 0 0 6px #1e2023,0 0 0 10px #2a2d31; }
    .editor-stage { margin:0 10px; }
    .toolbar { padding:8px 10px 6px 10px; }
    .tool-btn { min-width:48px; padding:5px 6px; font-size:9px; }
    .app-bar h1 { font-size:17px; }
  }
</style>
</head>
<body>
<div class="phone-frame" id="app">
  <div class="status-bar">
    <span>9:41</span>
    <span>📶 🔋</span>
  </div>

  <div class="app-bar">
    <h1>图片编辑器 Pro</h1>
    <div class="actions">
      <label class="btn btn-sm import-label" id="importLabel">
        <input type="file" id="fileInput" accept="image/*">
        📁 导入
      </label>
      <button class="btn btn-primary" id="exportBtn" type="button">导出</button>
    </div>
  </div>

  <div class="editor-stage" id="editorStage">
    <div class="placeholder" id="placeholder">
      <div class="icon">🖼️</div>
      <div class="text">点击“导入”按钮<br>选择一张图片开始编辑</div>
    </div>
    <div class="canvas-wrap" id="canvasWrap" style="display:none;">
      <img id="bgImage" alt="背景图片">
      <div class="overlay-layer" id="overlayLayer"></div>
    </div>
    <div class="loading-mask" id="loadingMask">
      <div class="loading-spinner"></div>
      <div>正在处理图片…</div>
    </div>
  </div>

  <!-- ★ 工具栏：未选中时只显示工具按钮 -->
  <div class="toolbar" id="toolbar">
    <!-- 工具按钮 -->
    <div class="tool-row">
      <button class="tool-btn" id="addTextBtn" type="button" disabled>
        <span class="ico">T</span><span>文字</span>
      </button>
      <button class="tool-btn" id="addBubbleBtn" type="button" disabled>
        <span class="ico">💬</span><span>对话框</span>
      </button>
      <button class="tool-btn" id="fontBtn" type="button" disabled>
        <span class="ico">Aa</span><span>字体</span>
      </button>
      <button class="tool-btn" id="deleteSelectedBtn" type="button" disabled>
        <span class="ico">🗑️</span><span>删除</span>
      </button>
      <button class="tool-btn" id="resetBtn" type="button" disabled>
        <span class="ico">↺</span><span>清空</span>
      </button>
    </div>

<script>
(function() {

  var borderRow = document.getElementById('borderRow');
  var radiusRow = document.getElementById('radiusRow');
  var tailSizeRow = document.getElementById('tailSizeRow');
  var tailSkewRow = document.getElementById('tailSkewRow');
  var styleScroll = document.getElementById('styleScroll');
  var tailScroll = document.getElementById('tailScroll');
  var specArea = document.getElementById('specArea');
  var toast = document.getElementById('toast');
  var editorStage = document.getElementById('editorStage');

  var colorPicker = document.getElementById('colorPicker');

  var fontList = document.getElementById('fontList');

  var selectedItem = null;
  var currentColor = '#1a1d21';
  var currentBgColor = '#ffffff';
  var currentBorderColor = '#1a1d21';
  var currentFontSize = 22;
  var currentWidth = 120;
  var currentHeight = 60;
  var currentPadding = 12;
  var currentOpacity = 100;
  var currentBorderWidth = 0;
  var currentRadius = 20;
  var currentTailSize = 14;
  var currentTailSkew = 0;
  var currentFont = '"Noto Sans SC", system-ui, sans-serif';
  var itemIdCounter = 0;
  var pendingCustomType = null;

  // 用于取消调整的备份
  var backupState = null;

  var FONTS = [
    { name: '系统默认', value: 'system-ui, -apple-system, sans-serif' },
    { name: 'Noto Sans SC 思源黑体', value: '"Noto Sans SC", sans-serif' },
    { name: 'Noto Serif SC 思源宋体', value: '"Noto Serif SC", serif' },
    { name: 'ZCOOL KuaiLe 站酷快乐体', value: '"ZCOOL KuaiLe", cursive' },
    { name: 'ZCOOL QingKe 站酷庆科黄油', value: '"ZCOOL QingKe HuangYou", cursive' },
    { name: 'Ma Shan Zheng 马善政毛笔', value: '"Ma Shan Zheng", cursive' },
    { name: 'Long Cang 龙藏体', value: '"Long Cang", cursive' },
    { name: 'Zhi Mang Xing 志莽行书', value: '"Zhi Mang Xing", cursive' },
    { name: 'Liu Jian Mao Cao 柳建毛草', value: '"Liu Jian Mao Cao", cursive' },
    { name: 'Roboto', value: '"Roboto", sans-serif' },
    { name: 'Playfair Display', value: '"Playfair Display", serif' },
    { name: 'Pacifico', value: '"Pacifico", cursive' },
    { name: 'Bebas Neue', value: '"Bebas Neue", sans-serif' },
    { name: 'Arial', value: 'Arial, Helvetica, sans-serif' },
    { name: 'Times New Roman', value: '"Times New Roman", Times, serif' },
    { name: 'Courier New', value: '"Courier New", Courier, monospace' },
    { name: 'Georgia', value: 'Georgia, serif' },
    { name: 'Comic Sans MS', value: '"Comic Sans MS", cursive' },
    { name: 'Impact', value: 'Impact, sans-serif' }
  ];

  function showToast(msg, duration) {
    duration = duration || 1800;
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toast._timer);
    toast._timer = setTimeout(function() { toast.classList.remove('show'); }, duration);
  }

  function showLoading(show) {
    loadingMask.classList.toggle('show', show);
  }

  // ==================== 面板折叠 ====================
  document.querySelectorAll('.panel-header').forEach(function(header) {
    header.addEventListener('click', function() {
      var panel = header.parentElement;
      panel.classList.toggle('open');
    });
  });

  // ★ 取消调整按钮
  document.querySelectorAll('[data-cancel]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var type = btn.dataset.cancel;
      if (type === 'color') {
        // 恢复颜色
        if (selectedItem) {
          applyBubbleStyle(selectedItem);
          applyTextStyle(selectedItem);
        }
        showToast('已取消颜色调整');
      } else if (type === 'style') {
        showToast('已取消样式调整');
      } else if (type === 'tail') {
        showToast('已取消尾巴调整');
      } else if (type === 'size') {
        showToast('已取消尺寸调整');
      } else if (type === 'border') {
        showToast('已取消边框调整');
      }
    });
  });

  // ==================== 选中/取消选中 ====================
  function deselectAll() {
    var items = document.querySelectorAll('.draggable-item.selected');
    for (var i = 0; i < items.length; i++) items[i].classList.remove('selected');
    selectedItem = null;
    updateToolbarState();
    updateSpecArea();
  }

  function selectItem(el) {
    if (selectedItem === el) return;
    deselectAll();
    if (el) {
      el.classList.add('selected');
      selectedItem = el;
      syncSlidersFromItem(el);
      syncColorsFromItem(el);
    }
    updateToolbarState();
    updateSpecArea();
  }

  function syncSlidersFromItem(el) {
    var fs = parseInt(el.dataset.fontSize || '22', 10);
    currentFontSize = fs;
    fontSizeSlider.value = fs;
    fontSizeVal.textContent = fs;
    fontSizeSlider.disabled = false;

    var w = parseInt(el.dataset.width || el.offsetWidth || '120', 10);
    currentWidth = w;
    widthSlider.value = w;
    widthVal.textContent = w;

    var h = parseInt(el.dataset.height || el.offsetHeight || '60', 10);
    currentHeight = h;
    heightSlider.value = h;
    heightVal.textContent = h;

    var pad = parseInt(el.dataset.padding || '12', 10);
    currentPadding = pad;
    paddingSlider.value = pad;
    paddingVal.textContent = pad;

    var op = parseInt(el.dataset.opacity || '100', 10);
    currentOpacity = op;
    opacitySlider.value = op;
    opacityVal.textContent = op;
    opacitySlider.disabled = false;

    var bw = parseInt(el.dataset.borderWidth || '0', 10);
    currentBorderWidth = bw;
    borderSlider.value = bw;
    borderVal.textContent = bw;
    borderSlider.disabled = false;

    var rd = parseInt(el.dataset.radius || '20', 10);
    currentRadius = rd;
    radiusSlider.value = rd;
    radiusVal.textContent = rd;

    var ts = parseInt(el.dataset.tailSize || '14', 10);
    currentTailSize = ts;
    tailSizeSlider.value = ts;
    tailSizeVal.textContent = ts;

    var tk = parseInt(el.dataset.tailSkew || '0', 10);
    currentTailSkew = tk;
    tailSkewSlider.value = tk;
    tailSkewVal.textContent = tk + '°';

    if (el.dataset.font) currentFont = el.dataset.font;
  }

  function syncColorsFromItem(el) {
    if (el.dataset.color) {
      currentColor = el.dataset.color;
      updateColorDots(textColorRow, el.dataset.color, 'color');
    }
    if (el.dataset.bgColor) {
      currentBgColor = el.dataset.bgColor;
      updateColorDots(bgColorRow, el.dataset.bgColor, 'bg-color');
    }
    if (el.dataset.borderColor) {
      currentBorderColor = el.dataset.borderColor;
      updateColorDots(borderColorRow, el.dataset.borderColor, 'border-color');
    }
  }

  function updateColorDots(row, color, attr) {
    var dots = row.querySelectorAll('.color-dot');
    var found = false;
    for (var i = 0; i < dots.length; i++) {
      if (dots[i].dataset.custom) continue;
      var dotColor = dots[i].dataset[attr];
      var match = dotColor && dotColor.toLowerCase() === color.toLowerCase();
      dots[i].classList.toggle('active', match);
      if (match) found = true;
    }
    // 如果没有匹配的预设色，则所有预设取消高亮
    if (!found) {
      for (var j = 0; j < dots.length; j++) {
        if (!dots[j].dataset.custom) dots[j].classList.remove('active');
      }
    }
  }

  function updateToolbarState() {
    var hasImage = canvasWrap.style.display !== 'none' && bgImage.src;
    addTextBtn.disabled = !hasImage;
    addBubbleBtn.disabled = !hasImage;
    fontBtn.disabled = !selectedItem || (selectedItem.dataset.type !== 'text' && selectedItem.dataset.type !== 'bubble');
    resetBtn.disabled = !hasImage;
    deleteSelectedBtn.disabled = !selectedItem;

    if (selectedItem) {
      opacitySlider.disabled = false;
      borderSlider.disabled = selectedItem.dataset.type !== 'bubble';
    } else {
      opacitySlider.disabled = true;
      borderSlider.disabled = true;
    }
  }

  // ★★★ 更新规格区显示：只在选中元素时显示 ★★★
  function updateSpecArea() {
    if (!selectedItem) {
      specArea.style.display = 'none';
      return;
    }

    specArea.style.display = 'flex';
    var type = selectedItem.dataset.type;

    // 样式面板：只对对话框显示
    document.getElementById('stylePanel').style.display = type === 'bubble' ? 'block' : 'none';
    // 尾巴面板：只对对话框显示
    document.getElementById('tailPanel').style.display = type === 'bubble' ? 'block' : 'none';
    // 颜色面板：都显示
    document.getElementById('colorPanel').style.display = 'block';
    // 尺寸面板：都显示
    document.getElementById('sizePanel').style.display = 'block';
    // 边框面板：都显示
    document.getElementById('borderPanel').style.display = 'block';

    // 颜色面板中背景/边框颜色：只对对话框显示
    bgColorRow.style.display = type === 'bubble' ? 'flex' : 'none';
    bgColorLabel.style.display = type === 'bubble' ? 'block' : 'none';
    borderColorRow.style.display = type === 'bubble' ? 'flex' : 'none';
    borderColorLabel.style.display = type === 'bubble' ? 'block' : 'none';

    // 尺寸面板中宽高/内边距/圆角：只对对话框显示
    widthRow.style.display = type === 'bubble' ? 'flex' : 'none';
    heightRow.style.display = type === 'bubble' ? 'flex' : 'none';
    paddingRow.style.display = type === 'bubble' ? 'flex' : 'none';
    radiusRow.style.display = type === 'bubble' ? 'flex' : 'none';

    // 尾巴滑块：选了尾巴才显示
    if (type === 'bubble') {
      var tail = selectedItem.dataset.tail || 'none';
      tailSizeRow.style.display = tail !== 'none' ? 'flex' : 'none';
      tailSkewRow.style.display = tail !== 'none' ? 'flex' : 'none';

      // 高亮当前样式
      var style = selectedItem.dataset.style || 'rounded';
      styleScroll.querySelectorAll('.style-chip').forEach(function(chip) {
        chip.classList.toggle('active', chip.dataset.style === style);
      });
      tailScroll.querySelectorAll('.style-chip').forEach(function(chip) {
        chip.classList.toggle('active', chip.dataset.tail === tail);
      });
    }
  }

  function genId() {
    return 'item_' + (++itemIdCounter) + '_' + Date.now();
  }

  // ==================== 拖拽 ====================
  function makeDraggable(el) {
    var startX = 0, startY = 0, startLeft = 0, startTop = 0;
    var isDragging = false;

    el.addEventListener('pointerdown', function(e) {
      if (e.target.closest('.delete-btn') || e.target.closest('.resize-handle')) return;
      if (el.querySelector('.editing')) return;
      e.preventDefault();
      selectItem(el);

      var wrapRect = canvasWrap.getBoundingClientRect();
      var elRect = el.getBoundingClientRect();
      startLeft = elRect.left - wrapRect.left;
      startTop = elRect.top - wrapRect.top;
      startX = e.clientX;
      startY = e.clientY;
      isDragging = true;
      try { el.setPointerCapture(e.pointerId); } catch(_) {}
      el.style.cursor = 'grabbing';
    });

    el.addEventListener('pointermove', function(e) {
      if (!isDragging) return;
      e.preventDefault();
      var dx = e.clientX - startX;
      var dy = e.clientY - startY;
      var newLeft = startLeft + dx;
      var newTop = startTop + dy;
      var wrapRect = canvasWrap.getBoundingClientRect();
      var elRect = el.getBoundingClientRect();
      var maxLeft = wrapRect.width - elRect.width + 20;
      var maxTop = wrapRect.height - elRect.height + 20;
      newLeft = Math.max(-10, Math.min(newLeft, maxLeft));
      newTop = Math.max(-10, Math.min(newTop, maxTop));
      el.style.left = newLeft + 'px';
      el.style.top = newTop + 'px';
    });

    el.addEventListener('pointerup', function(e) {
      if (!isDragging) return;
      isDragging = false;
      el.style.cursor = 'grab';
      try { el.releasePointerCapture(e.pointerId); } catch(_) {}
    });

    el.addEventListener('pointercancel', function() {
      isDragging = false;
      el.style.cursor = 'grab';
    });

    el.addEventListener('dblclick', function(e) {
      if (el.dataset.type === 'text' || el.dataset.type === 'bubble') {
        e.stopPropagation();
        startEditing(el);
      }
    });

    var lastTap = 0;
    el.addEventListener('touchend', function(e) {
      var now = Date.now();
      if (now - lastTap < 300) {
        e.preventDefault();
        if (el.dataset.type === 'text' || el.dataset.type === 'bubble') {
          startEditing(el);
        }
      }
      lastTap = now;
    }, { passive: false });
  }

  function startEditing(el) {
    if (el.querySelector('.editing')) return;
    var contentEl = el.querySelector('.content');
    if (!contentEl) return;
    var originalText = contentEl.textContent || '';
    var editor = document.createElement('div');
    editor.className = 'editing';
    editor.contentEditable = 'true';
    editor.style.outline = 'none';
    editor.style.minWidth = '20px';
    editor.style.display = 'inline-block';
    editor.textContent = originalText;
    contentEl.style.display = 'none';
    el.appendChild(editor);
    editor.focus();
    try {
      var range = document.createRange();
      range.selectNodeContents(editor);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    } catch(_) {}

    function finish() {
      var newText = editor.innerText || editor.textContent || '';
      if (!newText.trim()) newText = '文字';
      contentEl.textContent = newText;
      contentEl.style.display = '';
      editor.remove();
      el.dataset.text = newText;
    }

    editor.addEventListener('blur', finish);
    editor.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); editor.blur(); }
      if (e.key === 'Escape') { editor.textContent = originalText; editor.blur(); }
    });
  }

  function setupResize(el, handle) {
    var startX = 0, startY = 0, startSize = 0, resizing = false;

    handle.addEventListener('pointerdown', function(e) {
      e.stopPropagation();
      e.preventDefault();
      resizing = true;
      startX = e.clientX;
      startY = e.clientY;
      startSize = parseInt(el.dataset.fontSize || '22', 10);
      try { handle.setPointerCapture(e.pointerId); } catch(_) {}
    });

    handle.addEventListener('pointermove', function(e) {
      if (!resizing) return;
      e.preventDefault();
      var dx = e.clientX - startX;
      var dy = e.clientY - startY;
      var delta = Math.max(dx, dy) / 2;
      var newSize = Math.round(startSize + delta);
      newSize = Math.max(12, Math.min(120, newSize));
      el.dataset.fontSize = newSize;
      el.style.fontSize = newSize + 'px';
      if (selectedItem === el) {
        fontSizeSlider.value = newSize;
        fontSizeVal.textContent = newSize;
        currentFontSize = newSize;
      }
    });

    handle.addEventListener('pointerup', function(e) {
      resizing = false;
      try { handle.releasePointerCapture(e.pointerId); } catch(_) {}
    });
  }

  // ==================== 应用样式 ====================
  function applyBubbleStyle(el) {
    var style = el.dataset.style || 'rounded';
    var tail = el.dataset.tail || 'none';
    var bgColor = el.dataset.bgColor || '#ffffff';
    var borderColor = el.dataset.borderColor || '#1a1d21';
    var borderWidth = parseInt(el.dataset.borderWidth || '0', 10);
    var radius = parseInt(el.dataset.radius || '20', 10);
    var opacity = parseInt(el.dataset.opacity || '100', 10);
    var padding = parseInt(el.dataset.padding || '12', 10);
    var font = el.dataset.font || currentFont;
    var width = parseInt(el.dataset.width || '0', 10);
    var height = parseInt(el.dataset.height || '0', 10);
    var tailSize = parseInt(el.dataset.tailSize || '14', 10);
    var tailSkew = parseInt(el.dataset.tailSkew || '0', 10);

    el.className = 'draggable-item bubble-block';
    el.classList.add('shape-' + style);
    el.classList.remove('tail-none', 'tail-bottom-left', 'tail-bottom-right',
                        'tail-top-left', 'tail-top-right', 'tail-left', 'tail-right');
    if (tail !== 'none') el.classList.add('tail-' + tail);
    else el.classList.add('tail-none');

    el.style.background = bgColor;
    el.style.padding = padding + 'px ' + (padding + 4) + 'px';
    if (style !== 'ellipse' && style !== 'circle' && style !== 'thought') {
      el.style.borderRadius = radius + 'px';
    } else {
      el.style.borderRadius = '50%';
    }
    el.style.borderWidth = borderWidth + 'px';
    el.style.borderStyle = borderWidth > 0 ? 'solid' : 'none';
    el.style.borderColor = borderColor;
    el.style.opacity = (opacity / 100).toString();
    el.style.fontFamily = font;

    if (width > 0) el.style.width = width + 'px';
    if (height > 0) el.style.height = height + 'px';

    // ★ 尾巴颜色/粗细/倾斜
    el.style.setProperty('--tail-color', bgColor);
    el.style.setProperty('--tail-size', tailSize + 'px');
    el.style.setProperty('--tail-skew', tailSkew + 'deg');

    var textColor = el.dataset.color;
    if (!textColor) {
      var hex = bgColor.replace('#', '');
      var r = parseInt(hex.substr(0,2), 16);
      var g = parseInt(hex.substr(2,2), 16);
      var b = parseInt(hex.substr(4,2), 16);
      var brightness = (r*299 + g*587 + b*114) / 1000;
      textColor = brightness > 128 ? '#1a1d21' : '#ffffff';
      el.style.color = textColor;
    } else {
      el.style.color = textColor;
    }
  }

  function applyTextStyle(el) {
    var color = el.dataset.color || '#1a1d21';
    var opacity = parseInt(el.dataset.opacity || '100', 10);
    var font = el.dataset.font || currentFont;
    el.style.color = color;
    el.style.opacity = (opacity / 100).toString();
    el.style.fontFamily = font;
  }

  // ==================== 导出 ====================
  exportBtn.addEventListener('click', function() {
    if (canvasWrap.style.display === 'none' || !bgImage.src) {
      showToast('请先导入图片');
      return;
    }
    showToast('正在生成…', 2000);

    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function() {
      var canvas = document.createElement('canvas');
      var ctx = canvas.getContext('2d');
      var W = img.naturalWidth;
      var H = img.naturalHeight;
      canvas.width = W;
      canvas.height = H;
      ctx.drawImage(img, 0, 0, W, H);

      var imgRect = bgImage.getBoundingClientRect();
      var wrapRect = canvasWrap.getBoundingClientRect();
      var scaleX = W / imgRect.width;
      var scaleY = H / imgRect.height;
      var offsetX = imgRect.left - wrapRect.left;
      var offsetY = imgRect.top - wrapRect.top;

      var items = overlayLayer.querySelectorAll('.draggable-item');
      for (var i = 0; i < items.length; i++) {
        var el = items[i];
        var elRect = el.getBoundingClientRect();
        var x = (elRect.left - wrapRect.left - offsetX) * scaleX;
        var y = (elRect.top - wrapRect.top - offsetY) * scaleY;
        var fontSize = parseInt(el.dataset.fontSize || '22', 10) * scaleY;
        var text = el.dataset.text || '';
        var type = el.dataset.type;
        var opacity = parseInt(el.dataset.opacity || '100', 10) / 100;
        var font = el.dataset.font || currentFont;

        ctx.save();
        ctx.globalAlpha = opacity;

        if (type === 'text') {
          var textColor = el.dataset.color || '#1a1d21';
          ctx.font = '700 ' + fontSize + 'px ' + font;
          ctx.fillStyle = textColor;
          ctx.textBaseline = 'top';
          ctx.shadowColor = 'rgba(0,0,0,0.6)';
          ctx.shadowBlur = 8 * scaleY;
          ctx.shadowOffsetY = 2 * scaleY;
          var lines = text.split('\n');
          var lineHeight = fontSize * 1.25;
          for (var j = 0; j < lines.length; j++) {
            ctx.fillText(lines[j], x + 10 * scaleX, y + 6 * scaleY + j * lineHeight);
          }
        } else if (type === 'bubble') {
          drawBubbleToCanvas(ctx, el, x, y, elRect, scaleX, scaleY, W, H);
        }
        ctx.restore();
      }

      try {
        var dataUrl = canvas.toDataURL('image/png');
        var a = document.createElement('a');
        a.href = dataUrl;
        a.download = 'edited_' + Date.now() + '.png';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showToast('✅ 已导出');
      } catch (err) {
        showToast('导出失败：' + err.message);
      }
    };
    img.onerror = function() { showToast('导出失败'); };
    img.src = bgImage.src;
  });

  function drawBubbleToCanvas(ctx, el, x, y, elRect, scaleX, scaleY, W, H) {
    var style = el.dataset.style || 'rounded';
    var tail = el.dataset.tail || 'none';
    var bgColor = el.dataset.bgColor || '#ffffff';
    var borderColor = el.dataset.borderColor || '#1a1d21';
    var borderWidth = parseInt(el.dataset.borderWidth || '0', 10) * scaleX;
    var radius = parseInt(el.dataset.radius || '20', 10) * scaleX;
    var padding = parseInt(el.dataset.padding || '12', 10) * scaleX;
    var text = el.dataset.text || '';
    var fontSize = parseInt(el.dataset.fontSize || '22', 10) * scaleY;
    var textColor = el.dataset.color;
    var font = el.dataset.font || currentFont;
    var bw = elRect.width * scaleX;
    var bh = elRect.height * scaleY;
    var tailSize = parseInt(el.dataset.tailSize || '14', 10) * scaleX;
    var tailSkew = parseInt(el.dataset.tailSkew || '0', 10);

    if (!textColor) {
      var hex = bgColor.replace('#','');
      var r = parseInt(hex.substr(0,2),16);
      var g = parseInt(hex.substr(2,2),16);
      var b = parseInt(hex.substr(4,2),16);
      var brightness = (r*299 + g*587 + b*114) / 1000;
      textColor = brightness > 128 ? '#1a1d21' : '#ffffff';
    }

    ctx.fillStyle = bgColor;
    ctx.strokeStyle = borderColor;
    ctx.lineWidth = borderWidth;
    ctx.shadowColor = 'rgba(0,0,0,0.3)';
    ctx.shadowBlur = 12 * scaleX;
    ctx.shadowOffsetY = 4 * scaleY;

    if (style === 'rounded') {
      roundRect(ctx, x, y, bw, bh, radius);
      ctx.fill();
      if (borderWidth > 0) ctx.stroke();
      drawTail(ctx, tail, x, y, bw, bh, bgColor, borderColor, borderWidth, tailSize, tailSkew);
    } else if (style === 'rect') {
      ctx.beginPath();
      ctx.rect(x, y, bw, bh);
      ctx.fill();
      if (borderWidth > 0) ctx.stroke();
      drawTail(ctx, tail, x, y, bw, bh, bgColor, borderColor, borderWidth, tailSize, tailSkew);
    } else if (style === 'ellipse' || style === 'thought') {
      ctx.beginPath();
      ctx.ellipse(x + bw/2, y + bh/2, bw/2, bh/2, 0, 0, Math.PI * 2);
      ctx.fill();
      if (borderWidth > 0) ctx.stroke();
      if (style === 'thought') {
        ctx.beginPath();
        ctx.arc(x + 20*scaleX, y + bh + 12*scaleY, 8*scaleX, 0, Math.PI*2);
        ctx.fillStyle = bgColor;
        ctx.fill();
        if (borderWidth > 0) ctx.stroke();
        ctx.beginPath();
        ctx.arc(x + 8*scaleX, y + bh + 24*scaleY, 5*scaleX, 0, Math.PI*2);
        ctx.fill();
        if (borderWidth > 0) ctx.stroke();
      }
    } else if (style === 'narration') {
      ctx.beginPath();
      ctx.rect(x, y, bw, bh);
      ctx.fill();
      if (borderWidth > 0) ctx.stroke();
      ctx.fillStyle = borderColor;
      ctx.fillRect(x, y, 4 * scaleX, bh);
    } else if (style === 'exclaim') {
      drawExplosion(ctx, x, y, bw, bh, bgColor, borderColor, borderWidth);
    }

    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;
    ctx.fillStyle = textColor;
    ctx.font = '600 ' + fontSize + 'px ' + font;
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';
    var lines = text.split('\n');
    var lineHeight = fontSize * 1.4;
    var totalH = lines.length * lineHeight;
    var startY = y + bh/2 - totalH/2 + lineHeight/2;
    var centerX = x + bw/2;
    for (var k = 0; k < lines.length; k++) {
      ctx.fillText(lines[k], centerX, startY + k * lineHeight);
    }
  }

  function drawTail(ctx, tail, x, y, bw, bh, bgColor, borderColor, borderWidth, size, skew) {
    if (tail === 'none') return;
    ctx.fillStyle = bgColor;
    ctx.strokeStyle = borderColor;
    ctx.lineWidth = borderWidth;

    ctx.save();
    ctx.beginPath();

    if (tail === 'bottom-left') {
      // 用 skew 来倾斜
      var offset = Math.tan(skew * Math.PI / 180) * size;
      ctx.moveTo(x + 22, y + bh);
      ctx.lineTo(x + 22 + size + offset, y + bh);
      ctx.lineTo(x + 22, y + bh + size);
      ctx.closePath();
    } else if (tail === 'bottom-right') {
      var offset2 = Math.tan(skew * Math.PI / 180) * size;
      ctx.moveTo(x + bw - 22 - size - offset2, y + bh);
      ctx.lineTo(x + bw - 22, y + bh);
      ctx.lineTo(x + bw - 22, y + bh + size);
      ctx.closePath();
    } else if (tail === 'top-left') {
      var offset3 = Math.tan(skew * Math.PI / 180) * size;
      ctx.moveTo(x + 22, y);
      ctx.lineTo(x + 22 + size + offset3, y);
      ctx.lineTo(x + 22, y - size);
      ctx.closePath();
    } else if (tail === 'top-right') {
      var offset4 = Math.tan(skew * Math.PI / 180) * size;
      ctx.moveTo(x + bw - 22 - size - offset4, y);
      ctx.lineTo(x + bw - 22, y);
      ctx.lineTo(x + bw - 22, y - size);
      ctx.closePath();
    } else if (tail === 'left') {
      var offset5 = Math.tan(skew * Math.PI / 180) * size;
      ctx.moveTo(x, y + bh/2 - size/2 - offset5);
      ctx.lineTo(x, y + bh/2 + size/2 - offset5);
      ctx.lineTo(x - size, y + bh/2);
      ctx.closePath();
    } else if (tail === 'right') {
      var offset6 = Math.tan(skew * Math.PI / 180) * size;
      ctx.moveTo(x + bw, y + bh/2 - size/2 + offset6);
      ctx.lineTo(x + bw, y + bh/2 + size/2 + offset6);
      ctx.lineTo(x + bw + size, y + bh/2);
      ctx.closePath();
    }
    ctx.fill();
    if (borderWidth > 0) ctx.stroke();
    ctx.restore();
  }

  function drawExplosion(ctx, x, y, bw, bh, bgColor, borderColor, borderWidth) {
    ctx.fillStyle = bgColor;
    ctx.strokeStyle = borderColor;
    ctx.lineWidth = borderWidth;
    var spikes = 12;
    var cx = x + bw/2;
    var cy = y + bh/2;
    ctx.beginPath();
    for (var i = 0; i < spikes * 2; i++) {
      var angle = (Math.PI * 2 / (spikes * 2)) * i;
      var r = (i % 2 === 0) ? 1 : 0.85;
      var px = cx + Math.cos(angle) * (bw/2) * r;
      var py = cy + Math.sin(angle) * (bh/2) * r;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    if (borderWidth > 0) ctx.stroke();
  }

  function roundRect(ctx, x, y, w, h, r) {
    r = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  // 初始化
  updateToolbarState();
  updateSpecArea();

  // 默认打开样式面板和颜色面板
  document.getElementById('stylePanel').classList.add('open');
  document.getElementById('colorPanel').classList.add('open');
  document.getElementById('sizePanel').classList.add('open');

  console.log('[初始化] 编辑器 Pro 已就绪');
})();
</script>
